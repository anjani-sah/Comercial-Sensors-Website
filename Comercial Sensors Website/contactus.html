<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="stylesc.css">
</head>

<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <img src="Mini-Images/Logo.png" alt="Agro Tech Logo" class="logo">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="page1installation.html">Installation</a>
            <a href="about.html">About Us</a>
            <a href="contactus.html">Contacts</a>
        </div>
        <div class="auth-buttons">
            <!-- Sign In -->
            <button onclick="location.href='signin.html'">Sign In</button>
            <!-- Sign Out -->
            <button onclick="location.href='signout.html'">Sign Out</button>
            <!-- Cart Button -->
            <button class="cart-button" onclick="location.href='cart.html'">
                <img src="Mini-Images/cart-icon.png" alt="Cart Icon">
                Add to Cart
            </button>
        </div>
    </div>

    <div class="container">
        <div class="contact-info">
            <h2>Contact Information</h2>
            <p>Fill up the form and our Team will get back to you within 24 hours</p>
            <ul>
                <li>
                    <span>Phone: </span><a href="tel:+123456789">123456789</a>
                </li>
                <li>
                    <span>Email: </span><a href="mailto:info@agrosensor.com">info@agrosensor.com</a>
                </li>
                <li>
                    <span>Website: </span><a href="https://agrosensor.com">agrosensor.com</a>
                </li>
            </ul>
        </div>
        <div class="contact-form">
            <h2>Send us a message</h2>
            <form>
                <div class="input-group">
                    <label class="required"></label>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <label class="required"></label>
                    <input type="email" placeholder="Mail" required>
                    <label class="required"></label>
                    <input type="text" placeholder="Phone" required>
                </div>
                <textarea placeholder="Write your message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
    <script src="contact.js" defer></script>
</body>


</html>
